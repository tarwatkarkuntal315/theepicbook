[defaults]
inventory = inventory.ini
roles_path = roles
retry_files_enabled = False
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# Host-key checking stays ON. The pipeline builds a job-scoped known_hosts file with
# ssh-keyscan and passes it via ansible_ssh_common_args (see azure-pipelines.yml).

[ssh_connection]
pipelining = True
